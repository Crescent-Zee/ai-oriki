<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Oríkì — Yoruba Eulogy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
}
header {
    background: #1a1a2e;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid #2a2a3e;
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}
h1 {
    font-size: 1.8rem;
    background: linear-gradient(135deg, #f4a261, #e76f51);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}
.search-box {
    flex: 1;
    max-width: 500px;
    position: relative;
}
.search-box input {
    width: 100%;
    padding: 0.9rem 1.2rem;
    border-radius: 30px;
    border: 1px solid #2a2a3e;
    background: #0f0f1a;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
}
.search-box input:focus { border-color: #e76f51; }
.search-box button {
    position: absolute;
    right: 5px;
    top: 5px;
    bottom: 5px;
    padding: 0 1.5rem;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #f4a261, #e76f51);
    color: white;
    font-weight: 600;
    cursor: pointer;
}
main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.filters { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
.filter-btn {
    padding: 0.5rem 1rem;
    border-radius: 20px;
    border: 1px solid #2a2a3e;
    background: transparent;
    color: #a0a0b0;
    cursor: pointer;
    font-size: 0.9rem;
}
.filter-btn:hover, .filter-btn.active { border-color: #e76f51; color: #e76f51; }
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
}
.card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 1.5rem;
    cursor: pointer;
    border: 1px solid #2a2a3e;
    transition: all 0.3s;
}
.card:hover {
    transform: translateY(-4px);
    border-color: #e76f51;
    box-shadow: 0 10px 30px rgba(231, 111, 81, 0.2);
}
.card-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
}
.badge-recorded { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
.badge-tts { background: rgba(52, 152, 219, 0.2); color: #3498db; }
.card h3 { font-size: 1.4rem; margin-bottom: 0.3rem; color: #f4a261; }
.card .state { color: #a0a0b0; font-size: 0.9rem; margin-bottom: 0.5rem; }
.card .performer {
    color: #e76f51;
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
    font-weight: 500;
}
.card .preview {
    color: #808090;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-bottom: 1rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.card .play-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: #e76f51;
    font-weight: 600;
    font-size: 0.9rem;
}
.detail { display: none; max-width: 900px; margin: 0 auto; }
.detail.active { display: block; }
.back-btn {
    background: transparent;
    border: 1px solid #2a2a3e;
    color: #a0a0b0;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 2rem;
}
.back-btn:hover { border-color: #e76f51; color: #e76f51; }
.detail h2 { font-size: 2.5rem; color: #f4a261; margin-bottom: 0.5rem; }
.detail .meta { color: #a0a0b0; margin-bottom: 0.5rem; }
.detail .performer-info {
    color: #e76f51;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 2rem;
    padding: 0.75rem 1rem;
    background: rgba(231, 111, 81, 0.1);
    border-radius: 8px;
    border-left: 3px solid #e76f51;
}
.audio-player {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    border: 1px solid #2a2a3e;
}
.audio-player audio { width: 100%; margin-top: 1rem; }
.oriki-text {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 2rem;
    line-height: 2;
    font-size: 1.1rem;
    border: 1px solid #2a2a3e;
    white-space: pre-wrap;
}
.source-info {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(244, 162, 97, 0.1);
    border-left: 3px solid #f4a261;
    border-radius: 8px;
    font-size: 0.9rem;
    color: #a0a0b0;
}
.not-found { text-align: center; padding: 4rem 2rem; }
.not-found h2 { color: #e76f51; margin-bottom: 1rem; }
.suggestions {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
    margin-top: 2rem;
}
.loading { text-align: center; padding: 4rem; color: #a0a0b0; }
.stats { text-align: center; color: #808090; margin-bottom: 2rem; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>🎵 AI-Oríkì</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a town...">
            <button onclick="doSearch()">Search</button>
        </div>
    </div>
</header>

<main>
    <div id="browseView">
        <div class="stats" id="stats"></div>
        <div class="filters">
            <button class="filter-btn active" onclick="filterBy('all', event)">All</button>
            <button class="filter-btn" onclick="filterBy('recorded', event)">🎙️ Real Recordings</button>
            <button class="filter-btn" onclick="filterBy('tts_generated', event)">🔊 AI-Generated</button>
        </div>
        <div class="grid" id="grid"></div>
    </div>
    <div id="detailView" class="detail"></div>
    <div id="searchResults"></div>
</main>

<script>
const API_URL = window.location.origin;
let allEntries = [];

async function loadOriki() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '<div class="loading">Loading Oríkì...</div>';
    try {
        const res = await fetch(API_URL + '/api/oriki?limit=100');
        const data = await res.json();
        allEntries = data.results;
        document.getElementById('stats').textContent = 
            `📚 ${data.count} Oríkì available — click any card to listen`;
        renderGrid(allEntries);
    } catch (err) {
        grid.innerHTML = '<div class="loading">Error: ' + err.message + '</div>';
    }
}

function renderGrid(entries) {
    const grid = document.getElementById('grid');
    grid.innerHTML = entries.map(e => {
        const isReal = e.audio_type === 'recorded';
        let performerLine = '';
        if (isReal && e.performer && !e.performer.includes('MMS')) {
            performerLine = `<div class="performer">🎤 Performed by ${e.performer}</div>`;
        } else if (!isReal) {
            performerLine = `<div class="performer" style="color:#3498db;">🔊 AI-generated chanting</div>`;
        }
        
        return `
            <div class="card" onclick="showDetail('${e.id}')">
                <span class="card-badge ${isReal ? 'badge-recorded' : 'badge-tts'}">
                    ${isReal ? '🎙️ Real Recording' : '🔊 AI-Generated'}
                </span>
                <h3>${e.town}</h3>
                <div class="state">${e.state}</div>
                ${performerLine}
                <div class="preview">${e.text_preview}...</div>
                <div class="play-btn">▶ Listen</div>
            </div>
        `;
    }).join('');
}

function filterBy(type, event) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (type === 'all') renderGrid(allEntries);
    else renderGrid(allEntries.filter(e => e.audio_type === type));
}

async function showDetail(id) {
    document.getElementById('browseView').style.display = 'none';
    document.getElementById('searchResults').innerHTML = '';
    const detail = document.getElementById('detailView');
    detail.classList.add('active');
    detail.innerHTML = '<div class="loading">Loading...</div>';
    
    const res = await fetch(API_URL + '/api/oriki/' + id);
    const data = await res.json();
    const e = data.entry;
    const audioUrl = API_URL + '/api/audio/' + e.audio_file;
    const isReal = e.audio_type === 'recorded';
    const isAIGenerated = e.performer && e.performer.includes('MMS');
    
    let performerHTML = '';
    if (isReal && !isAIGenerated) {
        performerHTML = `<div class="performer-info">🎤 Performed by <strong>${e.performer}</strong></div>`;
    } else {
        performerHTML = `<div class="performer-info" style="background: rgba(52,152,219,0.1); border-color:#3498db; color:#3498db;">🔊 AI-generated chanting (MMS-TTS Yoruba)</div>`;
    }
    
    detail.innerHTML = `
        <button class="back-btn" onclick="backToBrowse()">← Back</button>
        <h2>${e.town}</h2>
        <div class="meta">${e.state} · ${isReal ? '🎙️ Real Recording' : '🔊 AI-Generated'}</div>
        ${performerHTML}
        <div class="audio-player">
            <strong>🎧 Listen to the Oríkì</strong>
            <audio controls src="${audioUrl}">Your browser does not support audio.</audio>
        </div>
        <div class="oriki-text">${e.text}</div>
        <div class="source-info">
            <strong>📖 Source:</strong> ${e.source || 'Field recording'}<br>
            <strong>🎤 Performer:</strong> ${isAIGenerated ? 'AI-generated (MMS-TTS)' : (e.performer || 'Unknown')}<br>
            <strong>🆔 ID:</strong> ${e.id}<br>
            <strong>🎵 Audio:</strong> ${isReal ? 'Real field recording' : 'AI-synthesized'}
        </div>
    `;
    window.scrollTo(0, 0);
}

function backToBrowse() {
    document.getElementById('detailView').classList.remove('active');
    document.getElementById('browseView').style.display = 'block';
}

async function doSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    document.getElementById('browseView').style.display = 'none';
    document.getElementById('detailView').classList.remove('active');
    const results = document.getElementById('searchResults');
    results.innerHTML = '<div class="loading">Searching...</div>';
    
    const res = await fetch(API_URL + '/api/search?q=' + encodeURIComponent(query));
    const data = await res.json();
    
    if (data.method === 'alias' || data.method === 'exact' || data.method === 'fuzzy') {
        const entry = data.results[0];
        const audioUrl = API_URL + '/api/audio/' + entry.audio_file;
        const isReal = entry.audio_type === 'recorded';
        const isAIGenerated = entry.performer && entry.performer.includes('MMS');
        const performerHTML = (isReal && !isAIGenerated) 
            ? `<div class="performer-info">🎤 Performed by <strong>${entry.performer}</strong></div>` 
            : `<div class="performer-info" style="background: rgba(52,152,219,0.1); border-color:#3498db; color:#3498db;">🔊 AI-generated chanting (MMS-TTS Yoruba)</div>`;
        results.innerHTML = `
            <button class="back-btn" onclick="backToBrowse()">← Back to Browse</button>
            <div class="detail active">
                <h2>${entry.town}</h2>
                <div class="meta">${entry.state} · Found via ${data.method}</div>
                ${performerHTML}
                <div class="audio-player">
                    <audio controls src="${audioUrl}"></audio>
                </div>
                <div class="oriki-text">${entry.text}</div>
            </div>
        `;
    } else {
        results.innerHTML = `
            <button class="back-btn" onclick="backToBrowse()">← Back to Browse</button>
            <div class="not-found">
                <h2>No exact match for "${query}"</h2>
                <p>We don't have an Oríkì for this town yet. Here are some similar ones:</p>
                <div class="suggestions">
                    ${data.suggestions.map(s => `
                        <div class="card" onclick="showDetail('${s.id}')">
                            <h3>${s.town}</h3>
                            <div class="play-btn">▶ Listen</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doSearch();
});

loadOriki();
</script>
</body>
</html>
